name: Collector release
on:
  push:
    tags: ["collector-v*"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-observatory/collector test
      - run: pnpm --filter @agent-observatory/collector build
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e 'const p=require("./apps/collector/package.json");if(process.env.GITHUB_REF_NAME!=="collector-v"+p.version)process.exit(1)'
      - run: pnpm --dir apps/collector pack --pack-destination "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        with:
          name: collector-package
          path: "*.tgz"
      - name: Publish to npm when credentials are configured
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'npm authentication is not configured; the verified package is available as an artifact.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm publish agent-observatory-collector-*.tgz --access public --provenance
