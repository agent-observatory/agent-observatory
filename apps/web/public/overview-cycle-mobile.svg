<title id="title">How Atlas works: local collection and remote analysis</title>
<desc id="desc">On your device, Collector syncs new Codex and Claude Code activity every 30 minutes. The remote Atlas service analyzes sessions on demand or daily and provides findings with evidence and next steps. Review findings and apply changes with your coding agent on your device.</desc>
