<title id="title">How Sessions works: local collection and remote analysis</title>
<desc id="desc">On your device, Atlas Collector syncs new Codex and Claude Code activity every 30 minutes. Agent Observatory analyzes sessions on demand or daily and provides findings with evidence and next steps. Review findings and apply changes with your coding agent on your device.</desc>
