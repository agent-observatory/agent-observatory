<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="948" viewBox="0 0 1280 948" role="img" aria-labelledby="title desc">
<title id="title">에이전트 세션 분석 서비스 배포 아키텍처</title>
<desc id="desc">GitHub 조직 공개 저장소에서 Vercel Hobby로 배포한다. 로컬 전송기는 5분마다 원본 JSON 배치를 Next.js에 전송하고 서버가 마스킹 후 Private Blob에 저장한다. 로컬 대기 파일은 서버 접수증 확인 후 삭제한다. Vercel Workflow와 Functions가 비동기 분석을 실행하고 Neon Postgres에 지표와 결과를 저장한다. OpenRouter는 허용한 축약 근거로 AI 설명을 생성한다. 하루 한 번 Cron 또는 수동 요청이 접수된 데이터를 대상으로 분석을 기동한다.</desc>
<rect width="1280" height="948" fill="#FFFFFF"/>
