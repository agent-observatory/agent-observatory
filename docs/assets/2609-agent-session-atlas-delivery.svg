<text x="24" y="78" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="400" fill="#31559F" text-anchor="start">접수 확인까지 로컬 파일 유지 · 마스킹은 서버에서 · 분석은 하루 1회 또는 수동</text>
