<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
<title id="title">레포 1개 · 애플리케이션 2개</title>
<desc id="desc">GitHub 조직 공개 모노레포에 Next.js 웹과 로컬 수집기, 공유 이벤트 계약을 둔다. 웹은 Vercel 한 프로젝트로 배포하며 Blob 연동 코드, Cron 설정과 API, Workflow 분석 코드가 포함된다. 수집기는 npm 공개 패키지로 배포하고 npx setup으로 사용자 장비에 고정 버전을 설치한다. OS 스케줄러는 설치된 수집기를 5분마다 실행한다.</desc>
<rect width="1120" height="720" fill="#FFFFFF"/>
