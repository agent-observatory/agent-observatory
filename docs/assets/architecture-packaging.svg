<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1004" viewBox="0 0 1400 1004" role="img" aria-labelledby="title desc">
<title id="title">모노레포 · 배포와 예약 실행</title><desc id="desc">하나의 GitHub 저장소에 웹, Collector, 공통 계약을 둔다. GitHub Actions가 웹 배포와 npm 릴리스 및 매시간 유지관리와 일일 분석 요청을 관리한다. Vercel 서울에 웹을 배포하고 Supabase 서울에 DB와 비공개 Storage를 둔다. 사용자의 OS는 Collector를 30분마다 실행한다.</desc>
