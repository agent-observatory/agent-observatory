<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1108" viewBox="0 0 1160 1108" role="img" aria-labelledby="title desc">
<title id="title">30분 전송·로컬 보관·재시도와 원격 분석</title>
<desc id="desc">로컬 전송기는 30분마다 완성된 새 기록을 일반 JSON으로 작성하고 영속 Outbox에 확정한 후 읽기 위치를 저장한다. Next.js 서버에 JSON을 보내면 서버가 Workspace의 마스킹 설정을 적용하고 비공개 Storage 저장과 Supabase DB 접수를 COMMIT한 뒤 접수증을 반환한다. 접수증을 확인한 로컬 전송기는 접수 상태를 기록하고 대기 파일을 삭제한다. 확인하지 못하면 파일과 재시도 시각을 보관해 다음 실행에서 같은 배치를 보낸다. 원격 분석은 GitHub Actions의 하루 한 번 호출 또는 수동 요청으로 Workflow를 실행한다.</desc>
